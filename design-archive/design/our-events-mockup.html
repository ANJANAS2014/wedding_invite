<style>body{margin:0;background:#1b0d10;font:500 12px system-ui;color:#e9d3a4}h1{font:500 13px system-ui;letter-spacing:.2em;text-transform:uppercase;margin:18px 20px 8px}
.row{display:flex;gap:28px;align-items:flex-start;padding:0 20px 30px;flex-wrap:wrap}.lab{margin:0 0 8px;opacity:.7}
.dw{width:min(100%,1280px*0.62)}.dbox{width:806px;height:1240px;overflow:hidden;border-radius:10px;box-shadow:0 0 0 1px #4a2a30}
.dbox iframe{width:1300px;height:2000px;border:0;transform:scale(.62);transform-origin:0 0}
.mbox{width:390px;height:1240px;overflow:hidden;border-radius:24px;box-shadow:0 0 0 8px #000}.mbox iframe{width:390px;height:1240px;border:0}</style></head><body>
<h1>Our Events — proposed redesign</h1>
<div class="row"><div><p class="lab">Desktop · 1300px (shown at 62%, scroll inside)</p><div class="dbox"><iframe srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;en&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;
&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500&amp;display=swap&quot;&gt;
&lt;style&gt;
:root{--burg:#5a1420;--burg-d:#3a0b14;--ivory:#f8efdc;--champ:#e9d3a4;--gold:#c19a3d;--gold-l:#f0d68e;--fh:&#x27;Cormorant Garamond&#x27;,Georgia,serif;--fb:&#x27;Jost&#x27;,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--burg-d);font:300 16px/1.6 var(--fb);color:var(--ivory);-webkit-font-smoothing:antialiased}
/* ===== Our Events (proposed) — maps onto EventsSection.tsx: section#s2 &gt; .sec#date ===== */
.ev{position:relative;padding:clamp(56px,8vw,104px) clamp(18px,5vw,72px) clamp(56px,7vw,92px);
  background:radial-gradient(1100px 520px at 50% -10%,#7a2232 0%,var(--burg) 46%,var(--burg-d) 100%);overflow:hidden}
.ev::before{content:&quot;&quot;;position:absolute;inset:0;opacity:.05;pointer-events:none;background:url(&quot;data:image/svg+xml,%3Csvg viewBox=&#x27;0 0 200 200&#x27; xmlns=&#x27;http://www.w3.org/2000/svg&#x27;%3E%3Cfilter id=&#x27;n&#x27;%3E%3CfeTurbulence type=&#x27;fractalNoise&#x27; baseFrequency=&#x27;.8&#x27; numOctaves=&#x27;3&#x27;/%3E%3C/filter%3E%3Crect width=&#x27;100%25&#x27; height=&#x27;100%25&#x27; filter=&#x27;url(%23n)&#x27;/%3E%3C/svg%3E&quot;)}
.ev-head{text-align:center;max-width:640px;margin:0 auto clamp(40px,6vw,72px)}
.eyebrow{font:500 11px/1 var(--fb);letter-spacing:.38em;text-transform:uppercase;color:var(--gold)}
.ev-head h2{font:400 clamp(40px,5.6vw,64px)/1 var(--fh);color:var(--champ);margin:14px 0 18px;letter-spacing:.01em}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold)}
.rule::before,.rule::after{content:&quot;&quot;;width:clamp(48px,8vw,88px);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{transform:scaleX(-1)}
.rule svg{width:14px;height:14px}
/* one event = one editorial &quot;chapter&quot; */
.chapter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(28px,5vw,72px);align-items:center;max-width:1100px;margin:0 auto}
.chapter+.chapter{margin-top:clamp(56px,7vw,96px)}
.chapter:nth-of-type(even) .ph{order:2}
.ph{position:relative;aspect-ratio:4/5;border-radius:999px 999px 6px 6px;overflow:hidden;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph::after{content:&quot;&quot;;position:absolute;inset:10px;border-radius:999px 999px 4px 4px;border:1px solid rgba(240,214,142,.55);pointer-events:none}
.ph.grade img{filter:sepia(.45) saturate(.8) contrast(1.06) brightness(.86)}       /* warm grade for the daylight venue photo */
.ph.grade::before{content:&quot;&quot;;position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(90,20,32,0) 35%,rgba(58,11,20,.85) 100%)}
.tx{position:relative}
.next[hidden]{display:none!important}
.next{display:inline-block;margin-bottom:18px;padding:6px 12px;border:1px solid rgba(240,214,142,.5);border-radius:999px;font:500 10px/1 var(--fb);letter-spacing:.28em;text-transform:uppercase;color:var(--gold-l)}
.date{display:flex;align-items:flex-end;gap:16px}
.date b{font:400 clamp(84px,10vw,128px)/.8 var(--fh);color:var(--champ);letter-spacing:-.02em}
.date span{padding-bottom:8px;font:500 11px/1.7 var(--fb);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.tx h3{margin:22px 0 4px;font:italic 400 clamp(40px,4.6vw,56px)/1 var(--fh);color:var(--ivory)}
.tx .sub{font:500 11px/1 var(--fb);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.det{list-style:none;margin:26px 0 0;border-top:1px solid rgba(240,214,142,.28)}
.det li{display:grid;grid-template-columns:88px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid rgba(240,214,142,.16)}
.det small{font:500 10px/1.9 var(--fb);letter-spacing:.3em;text-transform:uppercase;color:rgba(233,211,164,.7)}
.det b{font:500 clamp(19px,1.7vw,22px)/1.35 var(--fh);color:var(--ivory)}
.det em{display:block;font:300 14px/1.5 var(--fb);font-style:normal;color:rgba(248,239,220,.72)}
.acts{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:24px}
.acts a{display:inline-flex;align-items:center;gap:9px;min-height:44px;color:var(--gold-l);text-decoration:none;font:500 12px/1 var(--fb);letter-spacing:.22em;text-transform:uppercase;
  border-bottom:1px solid rgba(240,214,142,.45);transition:border-color .3s,color .3s}
.acts a:hover{color:#fff3c4;border-color:var(--gold-l)}
.acts svg{width:15px;height:15px}
/* countdown: one refined line */
.cd-wrap{max-width:760px;margin:clamp(64px,8vw,104px) auto 0;text-align:center}
.cd{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;border-top:1px solid rgba(240,214,142,.25);border-bottom:1px solid rgba(240,214,142,.25)}
.cd div{padding:18px 0 16px}
.cd div+div{border-left:1px solid rgba(240,214,142,.18)}
.cd b{display:block;font:400 clamp(36px,4.4vw,52px)/1 var(--fh);color:var(--champ);font-variant-numeric:lining-nums tabular-nums}
.cd span{display:block;margin-top:8px;font:500 9.5px/1 var(--fb);letter-spacing:.3em;text-transform:uppercase;color:rgba(233,211,164,.7)}
/* subtle entrance */
.reveal{opacity:0;transform:translateY(18px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
/* ===== mobile ===== */
@media (max-width:720px){
  .chapter{grid-template-columns:1fr;gap:0}
  .chapter:nth-of-type(even) .ph{order:0}
  .ph{aspect-ratio:4/3.4;border-radius:200px 200px 4px 4px;margin:0 6px}
  .tx{margin:-46px 12px 0;padding:22px 20px 8px;background:linear-gradient(180deg,rgba(58,11,20,.92),rgba(58,11,20,.98));border:1px solid rgba(240,214,142,.22);border-radius:4px;backdrop-filter:blur(6px)}
  .next{position:absolute;top:-14px;left:50%;transform:translateX(-50%);margin:0;background:var(--burg-d);white-space:nowrap}
  .date{justify-content:center;text-align:left}
  .date b{font-size:76px}
  .tx h3,.tx .sub{text-align:center}
  .tx h3{margin-top:14px;font-size:40px}
  .det li{grid-template-columns:70px 1fr;gap:12px;padding:12px 0}
  .det b{font-size:19px}
  .acts{justify-content:center;gap:4px 22px;margin-top:14px}
  .acts a{font-size:11px;letter-spacing:.18em}
  .cd b{font-size:32px}
  .cd span{font-size:8.5px;letter-spacing:.22em}
}

<div><p class="lab">Mobile · 390px (scroll inside)</p><div class="mbox"><iframe srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;en&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;
&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500&amp;display=swap&quot;&gt;
&lt;style&gt;
:root{--burg:#5a1420;--burg-d:#3a0b14;--ivory:#f8efdc;--champ:#e9d3a4;--gold:#c19a3d;--gold-l:#f0d68e;--fh:&#x27;Cormorant Garamond&#x27;,Georgia,serif;--fb:&#x27;Jost&#x27;,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--burg-d);font:300 16px/1.6 var(--fb);color:var(--ivory);-webkit-font-smoothing:antialiased}
/* ===== Our Events (proposed) — maps onto EventsSection.tsx: section#s2 &gt; .sec#date ===== */
.ev{position:relative;padding:clamp(56px,8vw,104px) clamp(18px,5vw,72px) clamp(56px,7vw,92px);
  background:radial-gradient(1100px 520px at 50% -10%,#7a2232 0%,var(--burg) 46%,var(--burg-d) 100%);overflow:hidden}
.ev::before{content:&quot;&quot;;position:absolute;inset:0;opacity:.05;pointer-events:none;background:url(&quot;data:image/svg+xml,%3Csvg viewBox=&#x27;0 0 200 200&#x27; xmlns=&#x27;http://www.w3.org/2000/svg&#x27;%3E%3Cfilter id=&#x27;n&#x27;%3E%3CfeTurbulence type=&#x27;fractalNoise&#x27; baseFrequency=&#x27;.8&#x27; numOctaves=&#x27;3&#x27;/%3E%3C/filter%3E%3Crect width=&#x27;100%25&#x27; height=&#x27;100%25&#x27; filter=&#x27;url(%23n)&#x27;/%3E%3C/svg%3E&quot;)}
.ev-head{text-align:center;max-width:640px;margin:0 auto clamp(40px,6vw,72px)}
.eyebrow{font:500 11px/1 var(--fb);letter-spacing:.38em;text-transform:uppercase;color:var(--gold)}
.ev-head h2{font:400 clamp(40px,5.6vw,64px)/1 var(--fh);color:var(--champ);margin:14px 0 18px;letter-spacing:.01em}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold)}
.rule::before,.rule::after{content:&quot;&quot;;width:clamp(48px,8vw,88px);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{transform:scaleX(-1)}
.rule svg{width:14px;height:14px}
/* one event = one editorial &quot;chapter&quot; */
.chapter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(28px,5vw,72px);align-items:center;max-width:1100px;margin:0 auto}
.chapter+.chapter{margin-top:clamp(56px,7vw,96px)}
.chapter:nth-of-type(even) .ph{order:2}
.ph{position:relative;aspect-ratio:4/5;border-radius:999px 999px 6px 6px;overflow:hidden;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph::after{content:&quot;&quot;;position:absolute;inset:10px;border-radius:999px 999px 4px 4px;border:1px solid rgba(240,214,142,.55);pointer-events:none}
.ph.grade img{filter:sepia(.45) saturate(.8) contrast(1.06) brightness(.86)}       /* warm grade for the daylight venue photo */
.ph.grade::before{content:&quot;&quot;;position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(90,20,32,0) 35%,rgba(58,11,20,.85) 100%)}
.tx{position:relative}
.next[hidden]{display:none!important}
.next{display:inline-block;margin-bottom:18px;padding:6px 12px;border:1px solid rgba(240,214,142,.5);border-radius:999px;font:500 10px/1 var(--fb);letter-spacing:.28em;text-transform:uppercase;color:var(--gold-l)}
.date{display:flex;align-items:flex-end;gap:16px}
.date b{font:400 clamp(84px,10vw,128px)/.8 var(--fh);color:var(--champ);letter-spacing:-.02em}
.date span{padding-bottom:8px;font:500 11px/1.7 var(--fb);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.tx h3{margin:22px 0 4px;font:italic 400 clamp(40px,4.6vw,56px)/1 var(--fh);color:var(--ivory)}
.tx .sub{font:500 11px/1 var(--fb);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.det{list-style:none;margin:26px 0 0;border-top:1px solid rgba(240,214,142,.28)}
.det li{display:grid;grid-template-columns:88px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid rgba(240,214,142,.16)}
.det small{font:500 10px/1.9 var(--fb);letter-spacing:.3em;text-transform:uppercase;color:rgba(233,211,164,.7)}
.det b{font:500 clamp(19px,1.7vw,22px)/1.35 var(--fh);color:var(--ivory)}
.det em{display:block;font:300 14px/1.5 var(--fb);font-style:normal;color:rgba(248,239,220,.72)}
.acts{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:24px}
.acts a{display:inline-flex;align-items:center;gap:9px;min-height:44px;color:var(--gold-l);text-decoration:none;font:500 12px/1 var(--fb);letter-spacing:.22em;text-transform:uppercase;
  border-bottom:1px solid rgba(240,214,142,.45);transition:border-color .3s,color .3s}
.acts a:hover{color:#fff3c4;border-color:var(--gold-l)}
.acts svg{width:15px;height:15px}
/* countdown: one refined line */
.cd-wrap{max-width:760px;margin:clamp(64px,8vw,104px) auto 0;text-align:center}
.cd{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;border-top:1px solid rgba(240,214,142,.25);border-bottom:1px solid rgba(240,214,142,.25)}
.cd div{padding:18px 0 16px}
.cd div+div{border-left:1px solid rgba(240,214,142,.18)}
.cd b{display:block;font:400 clamp(36px,4.4vw,52px)/1 var(--fh);color:var(--champ);font-variant-numeric:lining-nums tabular-nums}
.cd span{display:block;margin-top:8px;font:500 9.5px/1 var(--fb);letter-spacing:.3em;text-transform:uppercase;color:rgba(233,211,164,.7)}
/* subtle entrance */
.reveal{opacity:0;transform:translateY(18px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
/* ===== mobile ===== */
@media (max-width:720px){
  .chapter{grid-template-columns:1fr;gap:0}
  .chapter:nth-of-type(even) .ph{order:0}
  .ph{aspect-ratio:4/3.4;border-radius:200px 200px 4px 4px;margin:0 6px}
  .tx{margin:-46px 12px 0;padding:22px 20px 8px;background:linear-gradient(180deg,rgba(58,11,20,.92),rgba(58,11,20,.98));border:1px solid rgba(240,214,142,.22);border-radius:4px;backdrop-filter:blur(6px)}
  .next{position:absolute;top:-14px;left:50%;transform:translateX(-50%);margin:0;background:var(--burg-d);white-space:nowrap}
  .date{justify-content:center;text-align:left}
  .date b{font-size:76px}
  .tx h3,.tx .sub{text-align:center}
  .tx h3{margin-top:14px;font-size:40px}
  .det li{grid-template-columns:70px 1fr;gap:12px;padding:12px 0}
  .det b{font-size:19px}
  .acts{justify-content:center;gap:4px 22px;margin-top:14px}
  .acts a{font-size:11px;letter-spacing:.18em}
  .cd b{font-size:32px}
  .cd span{font-size:8.5px;letter-spacing:.22em}
}
