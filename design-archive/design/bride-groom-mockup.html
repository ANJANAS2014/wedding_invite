<style>body{margin:0;background:#1b0d10;font:500 12px system-ui;color:#e9d3a4}h1{font:500 13px system-ui;letter-spacing:.2em;text-transform:uppercase;margin:18px 20px 8px}
.row{display:flex;gap:28px;align-items:flex-start;padding:0 20px 30px;flex-wrap:wrap}.lab{margin:0 0 8px;opacity:.7}
.dbox{width:806px;height:1240px;overflow:hidden;border-radius:10px;box-shadow:0 0 0 1px #4a2a30}.dbox iframe{width:1300px;height:2000px;border:0;transform:scale(.62);transform-origin:0 0}
.mbox{width:390px;height:1240px;overflow:hidden;border-radius:24px;box-shadow:0 0 0 8px #000}.mbox iframe{width:390px;height:1240px;border:0}</style></head><body>
<h1>Bride & Groom — proposed redesign</h1><div class="row"><div><p class="lab">Desktop · 1300px (shown at 62%, scroll inside)</p><div class="dbox"><iframe srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;en&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;
&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500&amp;display=swap&quot;&gt;
&lt;style&gt;
:root{--burg:#5a1420;--ink:#3a1218;--ivory:#f8efdc;--paper:#fbf6ec;--champ:#e9d3a4;--gold:#b8892e;--gold-l:#d9b45f;--fh:&#x27;Cormorant Garamond&#x27;,Georgia,serif;--fb:&#x27;Jost&#x27;,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);font:300 16px/1.65 var(--fb);color:var(--ink);-webkit-font-smoothing:antialiased}
/* ===== Bride &amp; Groom (proposed) — maps onto CoupleSection.tsx: section#couple ===== */
.cp{position:relative;padding:clamp(56px,8vw,104px) clamp(18px,5vw,72px);background:radial-gradient(900px 500px at 50% 0,#fffaf1,var(--paper) 60%,#f3e9d8);overflow:hidden}
.cp::before{content:&quot;&quot;;position:absolute;inset:0;opacity:.04;pointer-events:none;background:url(&quot;data:image/svg+xml,%3Csvg viewBox=&#x27;0 0 200 200&#x27; xmlns=&#x27;http://www.w3.org/2000/svg&#x27;%3E%3Cfilter id=&#x27;n&#x27;%3E%3CfeTurbulence type=&#x27;fractalNoise&#x27; baseFrequency=&#x27;.8&#x27; numOctaves=&#x27;3&#x27;/%3E%3C/filter%3E%3Crect width=&#x27;100%25&#x27; height=&#x27;100%25&#x27; filter=&#x27;url(%23n)&#x27;/%3E%3C/svg%3E&quot;)}
.head{text-align:center;margin:0 auto clamp(40px,6vw,76px)}
.eyebrow{font:500 11px/1 var(--fb);letter-spacing:.38em;text-transform:uppercase;color:var(--gold)}
.head h2{font:400 clamp(40px,5.6vw,64px)/1 var(--fh);color:var(--burg);margin:14px 0 18px}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold)}
.rule::before,.rule::after{content:&quot;&quot;;width:clamp(48px,8vw,88px);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.rule::after{transform:scaleX(-1)}
.rule svg{width:14px;height:14px}
.pair{position:relative;display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(20px,3vw,48px);max-width:1120px;margin:0 auto;align-items:start}
.amp{align-self:center;font:italic 400 clamp(64px,8vw,120px)/1 var(--fh);color:var(--gold-l);opacity:.75;margin-top:-10%}
.person{position:relative}
.portrait{position:relative;margin:0 0 0 18px}
.portrait::before{content:&quot;&quot;;position:absolute;inset:-14px 14px 14px -14px;border:1px solid rgba(184,137,46,.55);border-radius:2px}
.portrait .img{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:2px;box-shadow:0 28px 50px -30px rgba(58,18,24,.55)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.18) saturate(.92) contrast(1.03)}
.person--bride .portrait{margin:0 18px 0 0}
.person--bride .portrait::before{inset:-14px -14px 14px 14px}
.role{display:block;margin:30px 0 4px;font:500 10.5px/1 var(--fb);letter-spacing:.36em;text-transform:uppercase;color:var(--gold)}
.person h3{font:italic 400 clamp(46px,5vw,68px)/.95 var(--fh);color:var(--burg)}
.story{margin-top:14px;max-width:34ch;font:400 clamp(17px,1.5vw,19px)/1.6 var(--fh);color:#4a2a2c}
.vow{position:relative;margin-top:24px;padding:18px 0 0 0;border-top:1px solid rgba(184,137,46,.35);max-width:36ch}
.vow small{font:500 10px/1 var(--fb);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.vow p{margin-top:10px;font:italic 400 clamp(20px,1.9vw,24px)/1.4 var(--fh);color:var(--burg)}
.person--bride{text-align:right}
.person--bride .story,.person--bride .vow{margin-left:auto}
.person--bride{margin-top:clamp(60px,9vw,120px)}  /* staggered, editorial */
.reveal{opacity:0;transform:translateY(18px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
@media (max-width:720px){
  .pair{grid-template-columns:1fr;gap:0}
  .amp{order:1;text-align:center;margin:26px 0 14px;font-size:64px}
  .person--bride{order:2;margin-top:0;text-align:left}
  .person--bride .story,.person--bride .vow{margin-left:0}
  .portrait,.person--bride .portrait{margin:0 14px 0 14px}
  .portrait::before,.person--bride .portrait::before{inset:-10px 10px 10px -10px}
  .person h3{padding-left:26px;font-size:52px}
  .role{margin:24px 0 4px 26px}
  .portrait .img{aspect-ratio:4/4.6}
  .story,.vow{margin-left:26px!important;margin-right:12px;max-width:none}
}

&lt;style&gt;
:root{--burg:#5a1420;--ink:#3a1218;--ivory:#f8efdc;--paper:#fbf6ec;--champ:#e9d3a4;--gold:#b8892e;--gold-l:#d9b45f;--fh:&#x27;Cormorant Garamond&#x27;,Georgia,serif;--fb:&#x27;Jost&#x27;,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);font:300 16px/1.65 var(--fb);color:var(--ink);-webkit-font-smoothing:antialiased}
/* ===== Bride &amp; Groom (proposed) — maps onto CoupleSection.tsx: section#couple ===== */
.cp{position:relative;padding:clamp(56px,8vw,104px) clamp(18px,5vw,72px);background:radial-gradient(900px 500px at 50% 0,#fffaf1,var(--paper) 60%,#f3e9d8);overflow:hidden}
.cp::before{content:&quot;&quot;;position:absolute;inset:0;opacity:.04;pointer-events:none;background:url(&quot;data:image/svg+xml,%3Csvg viewBox=&#x27;0 0 200 200&#x27; xmlns=&#x27;http://www.w3.org/2000/svg&#x27;%3E%3Cfilter id=&#x27;n&#x27;%3E%3CfeTurbulence type=&#x27;fractalNoise&#x27; baseFrequency=&#x27;.8&#x27; numOctaves=&#x27;3&#x27;/%3E%3C/filter%3E%3Crect width=&#x27;100%25&#x27; height=&#x27;100%25&#x27; filter=&#x27;url(%23n)&#x27;/%3E%3C/svg%3E&quot;)}
.head{text-align:center;margin:0 auto clamp(40px,6vw,76px)}
.eyebrow{font:500 11px/1 var(--fb);letter-spacing:.38em;text-transform:uppercase;color:var(--gold)}
.head h2{font:400 clamp(40px,5.6vw,64px)/1 var(--fh);color:var(--burg);margin:14px 0 18px}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold)}
.rule::before,.rule::after{content:&quot;&quot;;width:clamp(48px,8vw,88px);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.rule::after{transform:scaleX(-1)}
.rule svg{width:14px;height:14px}
.pair{position:relative;display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(20px,3vw,48px);max-width:1120px;margin:0 auto;align-items:start}
.amp{align-self:center;font:italic 400 clamp(64px,8vw,120px)/1 var(--fh);color:var(--gold-l);opacity:.75;margin-top:-10%}
.person{position:relative}
.portrait{position:relative;margin:0 0 0 18px}
.portrait::before{content:&quot;&quot;;position:absolute;inset:-14px 14px 14px -14px;border:1px solid rgba(184,137,46,.55);border-radius:2px}
.portrait .img{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:2px;box-shadow:0 28px 50px -30px rgba(58,18,24,.55)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.18) saturate(.92) contrast(1.03)}
.person--bride .portrait{margin:0 18px 0 0}
.person--bride .portrait::before{inset:-14px -14px 14px 14px}
.role{display:block;margin:30px 0 4px;font:500 10.5px/1 var(--fb);letter-spacing:.36em;text-transform:uppercase;color:var(--gold)}
.person h3{font:italic 400 clamp(46px,5vw,68px)/.95 var(--fh);color:var(--burg)}
.story{margin-top:14px;max-width:34ch;font:400 clamp(17px,1.5vw,19px)/1.6 var(--fh);color:#4a2a2c}
.vow{position:relative;margin-top:24px;padding:18px 0 0 0;border-top:1px solid rgba(184,137,46,.35);max-width:36ch}
.vow small{font:500 10px/1 var(--fb);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.vow p{margin-top:10px;font:italic 400 clamp(20px,1.9vw,24px)/1.4 var(--fh);color:var(--burg)}
.person--bride{text-align:right}
.person--bride .story,.person--bride .vow{margin-left:auto}
.person--bride{margin-top:clamp(60px,9vw,120px)}  /* staggered, editorial */
.reveal{opacity:0;transform:translateY(18px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
@media (max-width:720px){
  .pair{grid-template-columns:1fr;gap:0}
  .amp{order:1;text-align:center;margin:26px 0 14px;font-size:64px}
  .person--bride{order:2;margin-top:0;text-align:left}
  .person--bride .story,.person--bride .vow{margin-left:0}
  .portrait,.person--bride .portrait{margin:0 14px 0 14px}
  .portrait::before,.person--bride .portrait::before{inset:-10px 10px 10px -10px}
  .person h3{padding-left:26px;font-size:52px}
  .role{margin:24px 0 4px 26px}
  .portrait .img{aspect-ratio:4/4.6}
  .story,.vow{margin-left:26px!important;margin-right:12px;max-width:none}
}
